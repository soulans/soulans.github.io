<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="description" content="玖音接单排单表 · 漫展档期与可预约时间一览">
<title>玖音接单排单表</title>
<style>
/* ==========================================================================
 * 玖音接单排单表 · 展示端样式
 * 纯静态、无任何外部依赖；PC / 平板 / 手机自适应。
 * ========================================================================== */
:root{
  --bg:#f5f4fb;
  --surface:#ffffff;
  --surface-soft:#faf9ff;
  --ink:#211c38;
  --ink-2:#5b5573;
  --ink-3:#8b85a3;
  --line:#ebe8f6;
  --brand:#7c3aed;
  --brand-2:#ec4899;
  --brand-soft:#f2ecff;
  --free:#0f9d76;
  --free-soft:#e7f8f1;
  --busy:#d63384;
  --busy-soft:#fdeef6;
  --radius:18px;
  --shadow:0 8px 28px rgba(48,30,96,.075),0 2px 6px rgba(48,30,96,.045);
  --shadow-lg:0 18px 46px rgba(48,30,96,.14);
  --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* 平铺列宽与列间距：看板、悬浮表头、标题条、导航条共用同一组值，
     任何一处写死数字，手机横滑后「上面的分栏」就会跟下面的列错开 */
  --col-w:340px;--col-gap:14px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 420px at 8% -8%,rgba(124,58,237,.09),transparent 70%),
                   radial-gradient(760px 380px at 100% 0%,rgba(236,72,153,.08),transparent 70%);
  background-attachment:fixed;
}
img{max-width:100%}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid rgba(124,58,237,.45);outline-offset:2px}

.wrap{max-width:1180px;margin:0 auto;padding:0 22px 64px}

/* ---------------- 顶部 ---------------- */
.topbar{
  position:relative;background:linear-gradient(115deg,#6d28d9 0%,#8b3aed 45%,#d946a0 100%);
  color:#fff;overflow:hidden;
}
.topbar::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(520px 200px at 84% -40%,rgba(255,255,255,.28),transparent 70%);
}
.topbar-inner{max-width:1180px;margin:0 auto;padding:26px 22px 28px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.brand-mark{
  width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.32);
  font-size:20px;backdrop-filter:blur(6px);overflow:hidden;
}
/* 上传的图标：盒子跟着图走 —— 方图还是一小块，横版就自然变宽，不会裁成正方形 */
.brand-mark.has-img{
  display:block;width:auto;min-width:42px;max-width:132px;padding:0;
  background:transparent;border-color:rgba(255,255,255,.22);
}
.brand-mark.has-img img{width:auto;height:100%;max-width:100%;object-fit:contain;display:block}
h1.title{margin:0;font-size:clamp(22px,3.4vw,31px);font-weight:800;letter-spacing:.06em;line-height:1.25}
.subtitle{margin:5px 0 0;font-size:13px;color:rgba(255,255,255,.82);letter-spacing:.04em}

/* ---------------- 区块标题 ---------------- */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 18px;flex-wrap:wrap}
.sec-head h2{margin:0;font-size:19px;font-weight:750;letter-spacing:.03em}
.sec-head .hint{font-size:12.5px;color:var(--ink-3)}
.sec-head .bar{width:4px;height:17px;border-radius:4px;background:linear-gradient(var(--brand),var(--brand-2));display:inline-block;margin-right:9px;vertical-align:-2px}

/* ---------------- 首页卡片 ---------------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);transition:transform .28s ease,box-shadow .28s ease;
  display:flex;flex-direction:column;cursor:pointer;
}
.card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
.card:active{transform:translateY(-2px)}
.cover-wrap{position:relative;overflow:hidden;background:linear-gradient(135deg,#3b2266,#7a2b6b)}
/* 960x540 = 16:9 固定比例，按容器宽度等比缩放 */
.cover{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;transition:transform .45s ease}
.card:hover .cover{transform:scale(1.045)}
.cover-fallback{
  width:100%;aspect-ratio:16/9;display:grid;place-items:center;color:rgba(255,255,255,.75);
  font-size:14px;letter-spacing:.1em;background:linear-gradient(135deg,#4c1d95,#831843);
}
.cover-shade{position:absolute;inset:auto 0 0 0;height:46%;background:linear-gradient(transparent,rgba(20,12,40,.55));pointer-events:none}
.cover-badge{
  position:absolute;left:14px;bottom:13px;color:#fff;font-size:12px;letter-spacing:.05em;
  text-shadow:0 1px 6px rgba(0,0,0,.5);display:flex;align-items:center;gap:6px;
}
.card-body{padding:17px 18px 18px;display:flex;flex-direction:column;gap:11px;flex:1}
.card-title{margin:0;font-size:17.5px;font-weight:750;line-height:1.4;letter-spacing:.02em}
.meta-row{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ink-2);line-height:1.5}
.meta-row .ico{width:15px;flex:none;text-align:center;color:var(--brand);font-size:13px;margin-top:1px}
.meta-row span{min-width:0;word-break:break-word}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:1px}
.tag{
  display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11.5px;
  font-weight:650;letter-spacing:.03em;background:var(--brand-soft);color:#6d28d9;
  border:1px solid #e5d9ff;
}
.tag.t2{background:#fff0f7;color:#be2f78;border-color:#ffd9ec}
.tag.t3{background:#e9f7ff;color:#1d6fa5;border-color:#d3ecff}
.tag.t4{background:#f0fdf6;color:#17805c;border-color:#d3f2e2}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;margin-right:6px;opacity:.8}
.card-foot{
  margin-top:auto;padding-top:13px;border-top:1px dashed var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-3)
}
.go{color:var(--brand);font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.card:hover .go .arrow{transform:translateX(3px)}
.go .arrow{transition:transform .25s ease}

/* ---------------- 详情 ---------------- */
/* 顶部导航：返回入口为主，平铺页再跟一个「单日查看」 */
.topnav{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin:22px 0 15px;
}
.brand-link{
  display:inline-flex;align-items:center;flex:none;margin-right:2px;padding:2px;
  border-radius:10px;transition:transform .2s ease,opacity .2s ease;
}
.brand-link:hover{transform:translateY(-1px);opacity:.86}
.brand-link:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.brand-logo{display:block;height:40px;width:auto}
.brand-word{font-size:20px;font-weight:800;letter-spacing:.1em;color:var(--brand)}
/* 平铺标题条右侧的品牌 logo：空间不够时直接隐藏，不挤标题 */
.bar-brand{margin-left:auto;padding:0 2px}
.bar-brand .brand-logo{height:46px}
.back{
  display:inline-flex;align-items:center;gap:7px;margin:26px 0 16px;padding:8px 15px;
  border:1px solid var(--line);background:var(--surface);border-radius:999px;
  font-size:13px;color:var(--ink-2);box-shadow:var(--shadow);transition:all .2s ease;
}
.topnav .back{margin:0}
/* 平铺页：按钮组与标题条同宽居中，左边缘对齐（--days 由展示端写入） */
.topnav.board-nav{
  width:calc(var(--days,1) * var(--col-w) + (var(--days,1) - 1) * var(--col-gap));
  min-width:min(960px,100%);max-width:100%;
  margin-left:auto;margin-right:auto;
}
.back:hover{color:var(--brand);border-color:#d9c8ff;transform:translateX(-2px)}
.hero{
  position:relative;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-lg);
  background:#2a1a4d;
}
.hero .cover{aspect-ratio:16/9}
.hero-fallback{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,#4c1d95,#831843)}
.hero-veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,9,32,.82) 0%,rgba(14,9,32,.48) 46%,rgba(14,9,32,.06) 100%)}
.hero-veil::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(transparent,rgba(12,8,28,.72))}
.hero-txt{position:absolute;left:0;bottom:0;padding:26px 28px;color:#fff;max-width:min(680px,88%)}
.hero-txt h2{margin:0 0 10px;font-size:clamp(22px,3.6vw,34px);font-weight:800;letter-spacing:.04em;text-shadow:0 2px 14px rgba(0,0,0,.4)}
.hero-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:rgba(255,255,255,.9);margin-bottom:12px}
.hero-meta i{font-style:normal;opacity:.75;margin-right:6px}
.hero .tag{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.36);backdrop-filter:blur(6px)}

/* 日期切换 */
.daybar{
  margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px 20px;
}
.daybar-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.day-nav{
  width:42px;height:42px;flex:none;border-radius:13px;border:1px solid var(--line);
  background:var(--surface-soft);color:var(--brand);font-size:19px;line-height:1;
  display:grid;place-items:center;transition:all .2s ease;
}
.day-nav:hover:not(:disabled){background:var(--brand-soft);border-color:#d9c8ff;transform:scale(1.05)}
.day-nav:disabled{opacity:.35;cursor:not-allowed}
.day-dots{
  display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;
  padding:2px 2px 5px;scrollbar-width:thin;scroll-behavior:smooth;
}
.day-dots::-webkit-scrollbar{height:5px}
.day-dots::-webkit-scrollbar-thumb{background:#ddd6f5;border-radius:9px}
.day-dot{
  flex:none;padding:8px 16px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface-soft);font-size:13px;color:var(--ink-2);white-space:nowrap;
  transition:all .2s ease;line-height:1.35;
}
.day-dot:hover{border-color:#d9c8ff;color:var(--brand)}
.day-dot.on{background:linear-gradient(120deg,var(--brand),#a855f7);color:#fff;border-color:transparent;box-shadow:0 5px 14px rgba(124,58,237,.3);font-weight:700}
.day-dot small{display:block;font-size:10.5px;opacity:.72;font-weight:400;margin-top:1px}
.day-dot.on small{opacity:.9}

.summary{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px;padding-top:15px;border-top:1px dashed var(--line)}
.summary .num{font-size:13px;color:var(--ink-2)}
.summary .num b{font-size:19px;color:var(--free);font-weight:800;margin:0 3px}
.summary .num b.busy{color:var(--busy)}
.prog{flex:1;min-width:130px;height:8px;border-radius:9px;background:#eeeaf8;overflow:hidden}
.prog i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#34d399,#0f9d76);transition:width .5s ease}
.legend{font-size:11.5px;color:var(--ink-3);display:flex;gap:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}

/* 时段列表 */
.slots{display:flex;flex-direction:column;gap:11px;margin-top:18px}
.slot{
  position:relative;overflow:hidden;border-radius:15px;border:1px solid var(--line);
  background:var(--surface);box-shadow:var(--shadow);min-height:88px;
  display:flex;align-items:stretch;transition:transform .2s ease,box-shadow .2s ease;
}
.slot:hover{transform:translateX(3px);box-shadow:var(--shadow-lg)}
/* 已排单（无底图）：整行灰底，一眼看出这一段已经占掉了 */
.slot.is-busy:not(.has-bg){
  background:#f2f0f6;border-color:#e4e0ee;
}
.slot.is-busy:not(.has-bg):hover{background:#efeaf5}
.slot.has-bg{border-color:rgba(255,255,255,.35)}

/* 底图三层：模糊填充 → 清晰图（可调取景）→ 文字遮罩 */
.slot-bg{position:absolute;inset:0;z-index:0;overflow:hidden;background:#0b0918}
.slot-bg img,.slot-scrim{position:absolute;display:block;pointer-events:none;border:0}
/* 图片覆盖不到的地方（图比卡片窄时）用它自己的模糊放大版兜住，不会露白 */
.slot-blur{
  left:-12%;top:-12%;width:124%;height:124%;object-fit:cover;
  filter:blur(26px) saturate(1.5) brightness(.7);
}
/* 清晰图：--fz 是相对卡片高度的倍数；--fx/--fy 决定图片中心落在卡片的位置，默认偏右 */
.slot-photo{
  left:var(--fx,62%);top:var(--fy,50%);
  height:calc(100% * var(--fz,2));width:auto;max-width:none;
  transform:translate(-50%,-50%);
  /* 左右边缘羽化，和模糊填充层自然过渡，不出现一条硬边 */
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 11%,#000 89%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 11%,#000 89%,transparent 100%);
}
.slot-scrim{
  inset:0;
  /* 只压左侧文字区，右侧尽量留白给图片本身 */
  background:
    linear-gradient(90deg,rgba(8,6,20,.68) 0%,rgba(8,6,20,.44) 32%,rgba(8,6,20,.16) 64%,rgba(8,6,20,.02) 100%),
    linear-gradient(0deg,rgba(8,6,20,.26),rgba(8,6,20,0) 58%);
}
.slot-inner{position:relative;z-index:1;display:flex;align-items:center;gap:18px;width:100%;padding:15px 20px}
.slot-time{flex:none;width:104px}
.slot-time .t1{font-size:19px;font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.slot-time .t2{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-top:1px}
.slot-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.state{
  display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;
  font-size:12.5px;font-weight:700;letter-spacing:.03em;white-space:nowrap;
}
.state.free{background:var(--free-soft);color:var(--free);border:1px solid #c9f0e0}
.state.busy{background:var(--busy-soft);color:var(--busy);border:1px solid #f8d3e6}
.state i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.infos{display:flex;gap:8px;flex-wrap:wrap;min-width:0}
.info{
  display:inline-flex;align-items:baseline;gap:5px;padding:4px 10px;border-radius:9px;
  background:rgba(124,58,237,.08);font-size:12.5px;max-width:100%;
}
.info .k{color:var(--ink-3);font-size:11px;flex:none}
.info .v{font-weight:700;color:var(--ink);word-break:break-word}
.slot-rail{flex:none;width:4px;border-radius:9px;background:var(--free);align-self:stretch;opacity:.85}
.slot-rail.busy{background:var(--busy)}

/* 有底图时整体反色 */
.slot.has-bg .slot-time .t1,
.slot.has-bg .info .v,
.slot.has-bg .state.busy{color:#fff}
.slot.has-bg .slot-time .t1{text-shadow:0 1px 14px rgba(0,0,0,.5)}
.slot.has-bg .slot-time .t2,
.slot.has-bg .info .k{color:rgba(255,255,255,.74)}
/* 图片不再整体压暗，改用深色玻璃胶囊承载文字，亮图暗图上都读得清 */
.slot.has-bg .info{
  background:rgba(10,8,24,.46);border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.slot.has-bg .info .v{color:#fff}
.slot.has-bg .state.free{background:rgba(16,185,129,.32);color:#e6fff6;border-color:rgba(255,255,255,.28)}
.slot.has-bg .state.busy{background:rgba(219,39,119,.42);border-color:rgba(255,255,255,.28)}
.slot.has-bg{border-color:rgba(255,255,255,.18)}
.slot.has-bg .slot-rail{box-shadow:0 0 10px currentColor}

.empty{
  text-align:center;padding:60px 20px;color:var(--ink-3);background:var(--surface);
  border:1px dashed var(--line);border-radius:var(--radius);font-size:14px;
}
.empty .big{font-size:34px;display:block;margin-bottom:10px;opacity:.6}
.foot{text-align:center;color:var(--ink-3);font-size:11.5px;margin-top:38px;letter-spacing:.04em}

/* ---------------- 全档期平铺 ---------------- */
/* 平铺模式挣脱 1180px 限制，尽量铺满屏幕 */
.wrap-wide{max-width:none;padding-left:18px;padding-right:18px}
/* 单日页日期条右侧的平铺入口：纯图标按钮 */
.daybar-top .board-btn{
  width:42px;height:42px;flex:none;display:grid;place-items:center;
  border:1px solid var(--line);border-radius:13px;padding:0;
  color:var(--brand);font-size:17px;line-height:1;
  background:linear-gradient(120deg,var(--brand-soft),#f3e8ff);
  transition:all .2s ease;
}
.daybar-top .board-btn:hover{
  border-color:#d9c8ff;background:linear-gradient(120deg,#efe7ff,#f8f0ff);
  transform:scale(1.05);box-shadow:0 6px 14px rgba(124,58,237,.18);
}

/* 悬浮层：标题条钉在窗口顶部（离顶留一点缝）；日期列头浮在它下面。
   看板本身是横向滚动容器（overflow-x:auto），列头在里面没法沿纵轴 sticky，
   所以另渲染一条等宽、等距的 .headbar，用整行位移跟随看板 scrollLeft。
   容器左右出血到窗口边缘：钉住时用一层同色底把滑过的卡片挡住，不留缝。 */
.board-sticky{
  position:sticky;top:0;z-index:30;
  margin:4px -18px 0;padding:10px 18px 0;
}
/* 只有钉住时才铺底：未滚动时保持透明，不干扰页面本身的底色。
   用几乎不透明的实色遮住从上方滑过的卡片（不用 backdrop-filter：sticky 上会合成出穿透斑） */
.board-sticky.stuck{
  background:var(--bg);
}
.board-bar{
  /* 收窄到和下面日期列同宽（--days 由展示端写入），最小不小于头图宽度 960px；
     整条居中，与居中的看板对齐；天数多时最宽也只有一屏，不会跟着无限变宽。 */
  width:calc(var(--days,1) * var(--col-w) + (var(--days,1) - 1) * var(--col-gap));
  min-width:min(960px,100%);max-width:100%;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 auto;
  background:var(--surface);padding:14px 18px;
  /* 不再描边/圆角/投影：标题条读作页面上的一片白，和下面的日期条连成一体 */
  border:0;border-radius:0;box-shadow:none;
}
/* 钉住时不叠阴影：整条标题条与表头同色，滑过的卡片由 sticky 底色挡住 */
.board-sticky.stuck .board-bar{box-shadow:none}

/* 悬浮日期条：做成看板顶上的「表头」，不再是三张小卡片叠在卡片上。
   默认收起（不占位，避免布局跳动）。
   注意：这里**不做滚动容器**（overflow 一律 hidden），横向位置靠给整行加
   translate3d 跟随看板 scrollLeft，所以任何浏览器都不会在这里画出滚动条。 */
.headbar{
  position:absolute;left:0;right:0;top:100%;
  display:none;overflow:hidden;
  scrollbar-width:none;-ms-overflow-style:none;
  padding:0;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.headbar::-webkit-scrollbar{width:0;height:0;display:none}
.board-sticky.show-heads .headbar{display:block}
.headbar-row{
  display:flex;align-items:flex-end;gap:var(--col-gap);min-width:100%;
  box-sizing:border-box;padding:0 18px;
  transform:translate3d(var(--sx,0px),0,0);
  will-change:transform;
}
.hb-col{flex:0 0 var(--col-w);min-width:0;display:flex;position:relative}
/* 每天之间画一道竖线：切分更清楚。线落在列间空隙里（不占列宽），
   所以不会破坏与下方卡片列的一一对齐；两端渐隐，不会显得生硬 */
.hb-col + .hb-col::before{
  content:'';position:absolute;left:calc(var(--col-gap) / -2);top:4px;bottom:4px;width:1px;
  background:linear-gradient(to bottom,
    rgba(96,68,160,0) 0%, rgba(96,68,160,.46) 16%,
    rgba(96,68,160,.46) 84%, rgba(96,68,160,0) 100%);
  border-radius:1px;pointer-events:none;
}
/* 列少时不滚动，和看板一样整组居中 */
.headbar-row>.hb-col:first-child{margin-left:auto}
.headbar-row>.hb-col:last-child{margin-right:auto}
/* 表头单元格：只有文字，无底色无边框，整块可点，点了就跳到那一天 */
.headbar .hb-head{
  width:100%;padding:8px 2px 9px;background:none;
  border:0;border-radius:0;box-shadow:none;
}
.headbar .hb-head .prog{display:none}
.headbar .hb-head:hover{background:none}
.headbar .hb-head:hover .bch-date b,
.headbar .hb-head:hover .bch-stat b{color:var(--brand)}
.headbar .hb-head .bch-date b{font-size:13.5px}
.headbar .hb-head .bch-stat{font-size:10.5px}
.bh-cover{
  width:86px;height:48px;flex:none;border-radius:10px;object-fit:cover;
  border:1px solid var(--line);background:linear-gradient(135deg,#4c1d95,#831843);
}
.board-heading{flex:1;min-width:180px}
.board-heading h2{margin:0;font-size:17px;font-weight:750;letter-spacing:.03em;line-height:1.35}
.board-heading>span{font-size:11.5px;color:var(--ink-3)}
/* h2 里挂一枚状态标签（「招募中」这类），不额外占一行 */
.bh-tags{display:inline-flex;gap:6px;margin-left:9px;vertical-align:1px}
.bh-tags .tag{font-size:10.5px;padding:2px 8px}

/* 单日页的标题条：外观和平铺页同款，但占满内容宽度（不按 --days 收窄） */
.detail-bar{width:100%;min-width:0;margin:0 auto 16px}

/* 单日页整块钉顶：标题条 + 日期切换条，和平铺页同一套逻辑（.board-sticky.stuck 铺底遮住滑过的时段卡）。
   统计条拆到置顶区外面随正文滚动，避免置顶块过高压屏。
   标题条不当浮卡：无圆角、无描边、无阴影，和下面的日期条连成一片纯白，彼此不留缝也不分界。 */
.board-sticky.detail-sticky{padding-bottom:0}
.detail-sticky .board-bar{
  margin:0 auto;border-radius:0;border:0;box-shadow:none;
}
.board-sticky.detail-sticky.stuck .board-bar{box-shadow:none}
.detail-sticky .daybar-top{
  margin-top:0;padding:7px 18px 9px;gap:10px;
  background:var(--surface);
  border:0;border-radius:0;
}
.detail-sticky .day-nav{width:34px;height:34px;border-radius:10px;font-size:16px}
.detail-sticky .day-dot{padding:5px 12px;font-size:12.5px}
.detail-sticky .day-dot small{font-size:10px;margin-top:0}
.detail-sticky .board-btn{width:34px;height:34px;border-radius:10px;font-size:15px}
/* 统计条并入上面那片白：不描边、不圆角、不投影，和标题/日期条读作同一页 */
.detail-summary{
  margin-top:0;padding:4px 18px 14px;gap:12px;
  background:var(--surface);border:0;border-radius:0;box-shadow:none;
}
.detail-summary .num b{font-size:17px}

/* 封面小图：点开看宣传图，鼠标悬浮先给个预览 */
.bh-cover-wrap{
  position:relative;flex:none;display:block;padding:0;border:0;background:none;
  line-height:0;border-radius:10px;cursor:zoom-in;
}
.bh-cover-wrap:hover .bh-cover,
.bh-cover-wrap:focus-visible .bh-cover{box-shadow:0 0 0 2px rgba(124,58,237,.55)}
.cover-pop{
  position:absolute;left:0;top:calc(100% + 12px);z-index:90;display:none;width:320px;
  padding:6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow-lg);pointer-events:none;
}
.bh-cover-wrap:hover .cover-pop,
.bh-cover-wrap:focus-visible .cover-pop{display:block}
.cover-pop-img{
  display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;
  border-radius:10px;background:linear-gradient(135deg,#3b2266,#7a2b6b);
}

/* 宣传图灯箱：点封面或点遮罩关闭 */
.lightbox{
  position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  padding:24px;background:rgba(10,7,24,.88);cursor:zoom-out;
}
.lightbox.on{display:flex}
.lightbox img{
  max-width:min(1100px,94vw);max-height:86vh;width:auto;height:auto;
  border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.55);background:#100b22;
}
.lb-x{
  position:absolute;top:14px;right:16px;width:40px;height:40px;border-radius:50%;
  border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.14);color:#fff;
  font-size:22px;line-height:1;display:grid;place-items:center;cursor:pointer;
}
.lb-x:hover{background:rgba(255,255,255,.26)}
body.lb-open{overflow:hidden}
/* 平铺页的「单日查看」：跟着 logo 一起放在顶部导航里 */
.back-single{
  white-space:nowrap;padding:8px 15px;font-size:13px;font-weight:600;border-radius:999px;
  border:1px solid #d9c8ff;color:var(--brand);
  background:linear-gradient(120deg,var(--brand-soft),#f6ecff);
  box-shadow:var(--shadow);transition:all .2s ease;
}
.back-single:hover{transform:translateX(-2px);border-color:#c4a8ff;background:#efe5ff}

/* 只做横向滚动；纵向让看板整条延伸，交给页面本身滚动。
   全宽出血：卡片直接滑到窗口边缘，不再被一个有边框的容器裁出左右「边界」。 */
.board{
  /* 抵消 .wrap-wide 的左右内边距，让滚动区铺满整屏 */
  margin:16px -18px 0;padding:4px 18px;
  overflow-x:auto;overflow-y:hidden;
  background:none;border:0;border-radius:0;box-shadow:none;
  /* 横向滚动条隐藏：横滑靠按住拖动 / Shift + 滚轮 / ← → 键 */
  scrollbar-width:none;-ms-overflow-style:none;
  /* 不用 scroll-behavior:smooth：悬浮日期条要跟 scrollLeft 实时同步，平滑会拖后腿 */
  overscroll-behavior-x:contain;
  cursor:grab;
}
.board::-webkit-scrollbar{width:0;height:0;display:none}
.board.dragging{scroll-behavior:auto;cursor:grabbing;user-select:none;-webkit-user-select:none}
.board-grid{display:flex;align-items:stretch;gap:var(--col-gap);padding:12px 0;min-width:100%}
/* 列少时整组居中，和上方收窄后的标题栏落在同一组边界；列多溢出时 auto 外边距归零，横滑照常 */
.board-grid>.board-col:first-child{margin-left:auto}
.board-grid>.board-col:last-child{margin-right:auto}
.board-col{
  /* 列宽只要够放下「时间 + 状态 + CN/IP/角色」即可，不再按屏幕等比拉宽 */
  flex:0 0 var(--col-w);min-width:0;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
}
.board-col-head{
  position:relative;z-index:2;display:block;width:100%;text-align:left;
  padding:12px 14px 11px;background:var(--surface);border:0;
  border-bottom:1px solid var(--line);border-radius:13px 13px 0 0;
  min-height:var(--head-h,0px);
  box-shadow:0 4px 12px rgba(48,30,96,.05);transition:background .2s ease;
}
.board-col-head:hover{background:var(--brand-soft)}
.bch-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%}
.bch-date{display:inline-flex;align-items:baseline;gap:7px}
.bch-date b{font-size:15px;font-weight:800;white-space:nowrap}
.bch-date small{font-size:11px;color:var(--ink-3);white-space:nowrap}
.bch-stat{font-size:11px;color:var(--ink-3);white-space:nowrap}
.bch-stat b{color:var(--free);font-size:14px}
.board-col-head .prog{display:block;width:100%;min-width:0;height:6px;margin-top:9px;flex:none}
.board-col-body{padding:11px;display:flex;flex-direction:column;gap:9px}
.board-empty{
  text-align:center;padding:26px 8px;font-size:12px;color:var(--ink-3);
  border:1px dashed var(--line);border-radius:11px;
}

/* 平铺里的时段卡：高度固定，右侧内容分两行——第一行状态，第二行 CN/IP/角色 */
.board .slot{flex:none;height:84px;min-height:0;border-radius:12px}
.board .slot:hover{transform:none}
.board .slot-inner{padding:10px 12px;gap:12px}
.board .slot-time{width:82px;column-gap:6px}
/* 平铺列更窄，号牌跟着缩一圈 */
.board .slot-time .t1{font-size:16px}
.board .slot-time .t2{font-size:10.5px}
/* 状态与 CN/IP/角色 最多两行：先填第二行，放不下的 tag 才提到第一行（见 app.js 的 layoutSlotRow） */
.board .slot-main{
  flex-wrap:wrap;align-content:center;align-items:center;
  gap:5px 6px;width:100%;min-width:0;max-height:100%;overflow:hidden;
}
.board .state{font-size:11.5px;padding:3px 10px;flex:none}
.board .infos{display:contents}
.board .info{font-size:11px;padding:2px 7px;border-radius:8px;flex:0 1 auto;min-width:0}
.board .info .k{font-size:10px}
.board .info .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 第二行：从末尾往前把这一行填满，剩下的前缀留在第一行（分组由展示端按实际宽度算，tag 顺序不变）。
   整行占满宽度，自己也是一条可换行的行内 flex。 */
.board .slot-line{
  display:flex;align-items:center;gap:5px 6px;
  flex:0 0 100%;width:100%;min-width:0;
}
.board .slot-scrim{background:linear-gradient(90deg,rgba(8,6,20,.78),rgba(8,6,20,.34))}
.board .slot-blur{filter:blur(16px) saturate(1.5) brightness(.65)}

/* 窗口不够宽时标题条右侧放不下，品牌 logo 直接不显示（避免挤压标题） */
@media (max-width:900px){
  .bar-brand{display:none}
}

/* ---------------- 响应式 ---------------- */
@media (max-width:720px){
  /* 窄屏换列宽/列距：只改这两个变量，看板、表头、标题条、导航条一起跟着变 */
  :root{--col-w:360px;--col-gap:11px}
  .wrap{padding:0 14px 48px}
  /* 灯箱在手机上别贴边，图也别撑过高 */
  .lightbox{padding:10px}
  .lightbox img{max-height:76vh;border-radius:10px}
  .lb-x{top:10px;right:10px;width:36px;height:36px;font-size:20px}
  /* 悬浮预览在窄屏没意义（没有 hover），点开灯箱即可 */
  .cover-pop{display:none!important}
  .topbar-inner{padding:20px 16px 22px}
  .brand-mark{width:36px;height:36px;font-size:17px;border-radius:11px}
  .brand-mark.has-img{max-width:110px}
  .grid{grid-template-columns:1fr;gap:15px}
  .sec-head{margin:24px 0 14px}
  .hero-txt{padding:18px 18px;max-width:100%}
  .hero-meta{gap:12px;font-size:12.5px}
  .daybar{padding:14px 14px}
  .day-nav{width:38px;height:38px;font-size:17px}
  .slot-inner{padding:13px 14px;gap:12px}
  .slot-time{width:76px}
  .slot-time .t1{font-size:17px}
  .slot-main{gap:9px}
  .slot-rail{width:3px}
  .wrap-wide{padding-left:10px;padding-right:10px}
  .board{margin-left:-10px;margin-right:-10px;padding-left:10px;padding-right:10px}
  .board-grid{gap:var(--col-gap);padding:11px 0}
  .board-col{flex-basis:var(--col-w)}
  /* 悬浮层同样按窄屏出血，标题条与表头左右都不留空 */
  .board-sticky{margin:4px -10px 0;padding:8px 10px 0}
  /* 悬浮日期条与下面看板共用一套列宽 / 列距，横滑后仍逐列对齐 */
  .headbar-row{padding:0 10px;gap:var(--col-gap)}
  .hb-col{flex-basis:var(--col-w)}
  .hb-col + .hb-col::before{left:calc(var(--col-gap) / -2)}
  /* 顶部导航在窄屏收紧：logo 缩小，返回入口自然换行 */
  .topnav{gap:8px;margin:16px 0 12px}
  .brand-logo{height:32px}
  .brand-word{font-size:18px}
  .topnav .back,.topnav .back-single{padding:7px 13px;font-size:12px}
  /* 窄屏列宽/列距已由变量统一：这里只留 max-width 约束，不再重复写死数字 */
  .board-nav{max-width:100%}
  .board-bar{
    display:grid;grid-template-columns:auto 1fr;
    grid-template-areas:"cover head";
    gap:10px 12px;padding:12px 13px;align-items:center;
  }
  /* 窄屏隐藏日期条的细滚动条：触摸直接滑，箭头按钮也够用，别挤压 chips */
  .day-dots{scrollbar-width:none}
  .day-dots::-webkit-scrollbar{height:0}
  .bh-cover{grid-area:cover;width:64px;height:38px;border-radius:9px}
  .board-heading{grid-area:head;min-width:0;padding-right:2px}
  .board-heading h2{font-size:14.5px;line-height:1.4}
  .board-heading>span{font-size:10.5px}
  /* 窄屏把状态标签收起来，标题条只留两行，别把卡片撑高 */
  .bh-tags{display:none}
  .detail-bar{width:100%;min-width:0;padding:12px 13px}
}
@media (max-width:420px){
  /* 手机上列宽贴屏，表头 / 标题条也用同一个值，横滑时不会错列 */
  :root{--col-w:calc(100vw - 46px)}
  .card-body{padding:14px 15px 16px}
  .card-title{font-size:16px}
  .slot-inner{flex-wrap:wrap;gap:9px}
  .slot-time{width:100%;display:flex;align-items:center;gap:8px}
  .slot-time .t2{margin:0}
  .slot-rail{display:none}
  .summary{gap:10px}
  .legend{width:100%}
  /* 手机上的平铺列贴合屏幕宽度；卡片沿用单日的换行规则（时间一行、状态与信息逐行）。
     行高由展示端量出全表最高的一张卡、写成 --row-h，所有列同一行就落在同一水平线上。 */
  .board-col{flex:0 0 var(--col-w)}
  .board .slot{height:auto;min-height:var(--row-h,76px)}
  .board .slot-time{width:100%;display:flex;align-items:center;gap:8px}
  .board .slot-time .t2{margin:0}
  /* 窄屏允许换行，优先保证字看得全 */
  .board .slot-main{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px}
  .board .infos{flex-wrap:wrap;overflow:visible;width:auto}
  .board .info .v{white-space:normal;overflow:visible}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

</style>

<script>
/* ==========================================================================
 * 玖音接单排单表 · 展示端逻辑
 * 纯渲染：所有数据已由 exe 端生成并展平到 window.JIUYIN_DATA，
 * 本文件不做任何计算/请求，只负责把数据画出来并做日期切换。
 * 支持 file:// 直接双击打开（数据通过 <script> 注入，无 fetch/CORS）。
 * ========================================================================== */
(function () {
  'use strict';

  var DATA = window.JIUYIN_DATA || { title: '玖音接单排单表', exhibitions: [], generatedAt: '' };
  var EXS = Array.isArray(DATA.exhibitions) ? DATA.exhibitions : [];
  var APP = document.getElementById('app');
  var lastDetailDate = null;      // 从单日进入平铺前正在看的那天，返回时回到它

  /* ---------- 工具 ---------- */

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /** 生成 CSS url()：必须用单引号，若用双引号会截断外层的 style="..." 属性 */
  function cssUrl(s) {
    return "url('" + String(s).replace(/['\\]/g, '\\$&').replace(/[\r\n]/g, '') + "')";
  }

  function tagClass(i) { return ['', 't2', 't3', 't4'][i % 4]; }

  function tagsHTML(tags, limit) {
    var list = (tags || []).slice(0, limit || 99);
    if (!list.length) return '<span class="tag">待公布</span>';
    return list.map(function (t, i) {
      return '<span class="tag ' + tagClass(i) + '">' + esc(t) + '</span>';
    }).join('');
  }

  function coverHTML(cover, cls) {
    if (cover) {
      return '<img class="' + (cls || 'cover') + '" src="' + esc(cover) +
        '" alt="漫展头图" loading="lazy">';
    }
    return '<div class="cover-fallback">玖音 · 档期一览</div>';
  }

  function fmtGenerated(s) {
    if (!s) return '';
    var d = new Date(s);
    if (isNaN(d.getTime())) return '';
    function p(n) { return n < 10 ? '0' + n : '' + n; }
    return d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate()) +
      ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /** 品牌信息：标题 / 副标题 / 方形图标 / 顶部 logo 全部来自编辑端设置 */
  function brand() { return DATA.brand || {}; }

  function markHTML() {
    var m = brand().mark || '';
    return '<span class="brand-mark' + (m ? ' has-img' : '') + '" aria-hidden="true">' +
      (m ? '<img src="' + esc(m) + '" alt="">' : '✦') + '</span>';
  }

  function shell(inner, wide) {
    var b = brand();
    var sub = b.subtitle == null ? '漫展档期一览 · 点击查看每日可预约时间' : b.subtitle;
    return '<header class="topbar"><div class="topbar-inner">' +
      '<div class="brand">' + markHTML() +
      '<div><h1 class="title">' + esc(b.title || DATA.title || '玖音接单排单表') + '</h1>' +
      (sub ? '<p class="subtitle">' + esc(sub) + '</p>' : '') + '</div></div>' +
      '</div></header><main class="wrap' + (wide ? ' wrap-wide' : '') + '">' + inner +
      '<p class="foot">最近更新 ' +
      esc(fmtGenerated(DATA.generatedAt) || '—') + '</p></main>';
  }

  /* ---------- 首页 ---------- */

  function daysCount(ex) { return (ex.dates || []).length; }
  function freeCount(ex) {
    return (ex.dates || []).reduce(function (n, d) {
      return n + ((d.stats && d.stats.free) || 0);
    }, 0);
  }

  function cardHTML(ex) {
    var n = daysCount(ex), f = freeCount(ex);
    return '<article class="card" data-act="open" data-id="' + esc(ex.id) +
      '" role="link" tabindex="0" aria-label="查看 ' + esc(ex.name) + ' 排期">' +
      '<div class="cover-wrap">' + coverHTML(ex.cover) +
      '<div class="cover-shade"></div>' +
      '<div class="cover-badge">✦ ' + esc(ex.timeText || '档期待定') + '</div></div>' +
      '<div class="card-body">' +
      '<h3 class="card-title">' + esc(ex.name) + '</h3>' +
      '<div class="meta-row"><span class="ico">◷</span><span>' +
      esc(ex.timeText || '时间待定') + '</span></div>' +
      '<div class="meta-row"><span class="ico">⌖</span><span>' +
      esc(ex.location || '地点待定') + '</span></div>' +
      '<div class="tags">' + tagsHTML(ex.statusTags) + '</div>' +
      '<div class="card-foot"><span>' + n + ' 个可约日 · ' + f + ' 个空闲档</span>' +
      '<span class="go">查看排期 <span class="arrow">→</span></span></div>' +
      '</div></article>';
  }

  function renderHome() {
    var inner = '<div class="sec-head"><h2><span class="bar"></span>漫展档期</h2></div>';
    if (!EXS.length) {
      inner += '<div class="empty"><span class="big">◌</span>暂无漫展档期，请等待桌面端生成内容。</div>';
    } else {
      inner += '<div class="grid">' + EXS.map(cardHTML).join('') + '</div>';
    }
    APP.innerHTML = shell(inner);
    window.scrollTo(0, 0);
  }

  /* ---------- 详情 ---------- */

  function infoHTML(k, v) {
    if (v == null || String(v).trim() === '') return '';
    return '<span class="info"><span class="k">' + esc(k) + '</span>' +
      '<span class="v">' + esc(v) + '</span></span>';
  }

  function slotHTML(s) {
    var hasBg = !!s.bg;
    var infos = infoHTML('CN', s.cn) + infoHTML('IP', s.ip) + infoHTML('角色', s.role);
    var state = s.free
      ? '<span class="state free"><i></i>空闲 · 可预约</span>'
      : '<span class="state busy"><i></i>已排单</span>';
    // 取景：--fx/--fy 是图片中心落在卡片里的位置（百分比），--fz 是相对卡片高度的放大倍数
    var fx = s.fx == null ? 62 : +s.fx;
    var fy = s.fy == null ? 50 : +s.fy;
    var fz = s.fz == null ? 2 : +s.fz;
    var src = hasBg ? esc(s.bg) : '';
    var bgLayer = hasBg
      ? '<div class="slot-bg" style="--fx:' + fx + '%;--fy:' + fy + '%;--fz:' + fz + '">' +
        '<img class="slot-blur" src="' + src + '" alt="" aria-hidden="true">' +
        '<img class="slot-photo" src="' + src + '" alt="" aria-hidden="true">' +
        '<i class="slot-scrim"></i></div>'
      : '';
    return '<div class="slot' + (hasBg ? ' has-bg' : '') + (s.free ? '' : ' is-busy') + '">' +
      bgLayer +
      '<div class="slot-inner">' +
      '<div class="slot-time">' +
      '<div class="t1">' + esc(s.time) + '</div>' +
      '<div class="t2">至 ' + esc(s.end) + '</div></div>' +
      '<div class="slot-main">' + state + (infos ? '<div class="infos">' + infos + '</div>' : '') +
      '</div><div class="slot-rail' + (s.free ? '' : ' busy') + '"></div>' +
      '</div></div>';
  }

  /* ---------- 顶部导航（返回入口 / 品牌 logo） ---------- */

  /** 品牌 logo：点它等同「返回漫展列表」。没设 logo 时整块不渲染（不显示，也不塞文字占位） */
  function brandHTML(cls) {
    var logo = brand().logo || '';
    if (!logo) return '';
    var name = brand().title || '玖音';
    return '<a class="brand-link' + (cls ? ' ' + cls : '') + '" data-act="home"' +
      ' role="button" tabindex="0" aria-label="' + esc(name) + ' · 返回漫展列表" title="返回漫展列表">' +
      '<img class="brand-logo" src="' + esc(logo) + '" alt="' + esc(name) + '"></a>';
  }

  /**
   * 顶部导航条：先「返回漫展列表」，平铺页再跟一个「单日查看」。
   * logo 由各页面自己安排位置（详情页在导航左侧，平铺页在标题条右侧）。
   */
  function navHTML(showSingle, showBrand, days) {
    return '<nav class="topnav' + (days ? ' board-nav' : '') + '"' +
      (days ? ' style="--days:' + Math.max(1, days) + '"' : '') + '>' +
      (showBrand ? brandHTML() : '') +
      '<a class="back" data-act="home" role="button" tabindex="0">← 返回漫展列表</a>' +
      (showSingle ? '<button class="back-single" data-act="single">← 单日查看</button>' : '') +
      '</nav>';
  }

  /* ---------- 标题条（单日 / 平铺共用）：封面 + 名称 + 档期 + 品牌 logo ---------- */

  /** 点封面（或鼠标悬浮）看宣传图：hover 弹预览，点击开全屏灯箱 */
  function barInner(ex, days) {
    var tags = (ex.statusTags || []).slice(0, 1);
    return '<button class="bh-cover-wrap" type="button" data-act="cover"' +
      ' aria-label="查看 ' + esc(ex.name) + ' 的宣传图" title="看宣传图">' +
      coverHTML(ex.cover, 'bh-cover') +
      '<span class="cover-pop">' + coverHTML(ex.cover, 'cover-pop-img') + '</span>' +
      '</button>' +
      '<div class="board-heading"><h2>' + esc(ex.name) +
      (tags.length ? '<span class="bh-tags">' + tagsHTML(tags, 1) + '</span>' : '') + '</h2>' +
      '<span class="bh-meta">' + esc(ex.timeText || '时间待定') + ' · ' +
      esc(ex.location || '地点待定') + ' · 共 ' + days + ' 天</span></div>' +
      brandHTML('bar-brand');
  }

  /* ---------- 宣传图灯箱 ---------- */

  function coverBox() {
    var el = document.getElementById('jyLightbox');
    if (!el) {
      el = document.createElement('div');
      el.id = 'jyLightbox';
      el.className = 'lightbox';
      el.setAttribute('role', 'dialog');
      el.setAttribute('aria-modal', 'true');
      el.innerHTML = '<button class="lb-x" type="button" aria-label="关闭">×</button>' +
        '<img alt="">';
      el.addEventListener('click', closeCover);
      document.body.appendChild(el);
    }
    return el;
  }

  function openCover(src, name) {
    if (!src) return;
    var el = coverBox();
    var im = el.querySelector('img');
    im.src = src;
    im.alt = (name || '漫展') + ' 宣传图';
    el.classList.add('on');
    document.body.classList.add('lb-open');
  }

  function closeCover() {
    var el = document.getElementById('jyLightbox');
    if (!el) return;
    el.classList.remove('on');
    document.body.classList.remove('lb-open');
  }

  function renderDetail(ex, dateIndex) {
    var dates = ex.dates || [];
    var idx = Math.max(0, Math.min(dates.length - 1, dateIndex | 0));
    // 单日页也用平铺页那条紧凑标题条（不再铺一整屏大图），封面可看宣传图
    // 标题条 + 日期条一起塞进 .board-sticky：下滚时整块钉在窗口顶部，和平铺页同一套逻辑
    var head = navHTML(false, false) +
      '<div class="board-sticky detail-sticky" id="boardSticky" style="--days:' +
      Math.max(1, dates.length) + '">' +
      '<section class="board-bar detail-bar">' + barInner(ex, dates.length) + '</section>';

    if (!dates.length) {
      APP.innerHTML = shell(head + '</div><div class="empty" style="margin-top:20px">' +
        '<span class="big">◌</span>该漫展暂未配置可预约日期</div>');
      return;
    }
    lastDetailDate = dates[idx].date;

    var d = dates[idx];
    var st = d.stats || { total: (d.slots || []).length, free: 0, booked: 0 };
    var pct = st.total ? Math.round(st.free / st.total * 100) : 0;

    // 只把「日期切换」留在置顶区，统计条随正文滚走：置顶厚度与平铺页一致
    var daytop = '<div class="daybar-top">' +
      '<button class="day-nav" data-act="prev" data-i="' + idx + '"' +
      (idx <= 0 ? ' disabled' : '') + ' aria-label="上一天">‹</button>' +
      '<div class="day-dots">' + dates.map(function (x, i) {
        return '<button class="day-dot' + (i === idx ? ' on' : '') + '" data-act="day" data-i="' + i +
          '" title="' + esc(x.date) + '" aria-label="' + esc(x.date) + '">' +
          esc(x.label) + '<small>' + esc(x.weekday) + '</small></button>';
      }).join('') + '</div>' +
      '<button class="board-btn" data-act="board" title="全部平铺：把 ' + dates.length +
      ' 天并排铺开，可左右滑动查看" aria-label="全部平铺查看">⊞</button>' +
      '<button class="day-nav" data-act="next" data-i="' + idx + '"' +
      (idx >= dates.length - 1 ? ' disabled' : '') + ' aria-label="下一天">›</button>' +
      '</div>' +
      '</div>';   // 闭合 .board-sticky：统计条与时段列表都在它外面，正常滚动

    var summary = '<div class="summary detail-summary"><span class="num">空闲 <b>' + st.free + '</b> / 共 ' + st.total + ' 档' +
      '　已排 <b class="busy">' + st.booked + '</b></span>' +
      '<div class="prog"><i style="width:' + pct + '%"></i></div>' +
      '<div class="legend"><span><i style="background:#0f9d76"></i>空闲可约</span>' +
      '<span><i style="background:#d63384"></i>已排单</span></div></div>';

    var slots = (d.slots || []).length
      ? '<div class="slots">' + d.slots.map(function (s) { return slotHTML(s); }).join('') + '</div>'
      : '<div class="empty" style="margin-top:18px"><span class="big">◌</span>该日期暂无时间段</div>';

    APP.innerHTML = shell(head + daytop + summary + slots);
    // 让当前选中的日期在横滑条中保持可见（多日期时尤为重要）
    var onDot = APP.querySelector ? APP.querySelector('.day-dot.on') : null;
    if (onDot && onDot.scrollIntoView) {
      try { onDot.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) { /* noop */ }
    }
    // 与平铺页同一套悬浮逻辑：只钉住，日期条随标题条常显
    STICKY.wrap = APP.querySelector ? APP.querySelector('.board-sticky') : null;
    STICKY.head = null; STICKY.board = null;
    if (STICKY.wrap) { bindSticky(); stickyTick(); }
  }

  /* ---------- 全档期平铺（所有日期并排，可左右滑动） ---------- */

  var BOARD = { dragging: false, moved: false, x0: 0, y0: 0, left0: 0, top0: 0, pid: null };

  /* 看板悬浮：标题条 sticky 置顶，下面的日期列头条跟着看板横向同步。
     看板本身是横向滚动容器，列头在里面 sticky 不住纵轴，所以另做一条克隆条。 */
  var STICKY = { wrap: null, head: null, board: null, bound: false };

  /** 悬浮日期条跟随看板横向位置：整行位移（不做滚动容器，永远不会有滚动条） */
  function syncHead() {
    var b = STICKY.board, hb = STICKY.head;
    if (!b || !hb || !hb.style || !hb.style.setProperty) return;
    hb.style.setProperty('--sx', (-b.scrollLeft) + 'px');
  }

  function stickyTick() {
    var wrap = STICKY.wrap;
    if (!wrap || !wrap.isConnected) return;
    var wr = wrap.getBoundingClientRect();
    wrap.classList.toggle('stuck', wr.top <= 0.5);
    // 单日页没有看板：标题条 + 日期条整块钉顶，不需要克隆列头条
    var b = STICKY.board, hb = STICKY.head;
    if (!b || !hb) return;
    var br = b.getBoundingClientRect();
    // 真正的列头被标题条盖住时，才浮出日期条；滚回顶部会自动收起
    wrap.classList.toggle('show-heads', br.top < wr.bottom - 6);
    syncHead();
  }

  function bindSticky() {
    if (STICKY.bound) return;
    STICKY.bound = true;
    window.addEventListener('scroll', stickyTick, { passive: true });
    window.addEventListener('resize', stickyTick);
  }

  /** 列头（日期 + 空闲数 + 进度）：看板里和悬浮日期条共用同一份结构，两边永远一致 */
  function colHeadHTML(d, i, clone) {
    var st = d.stats || { total: (d.slots || []).length, free: 0, booked: 0 };
    var pct = st.total ? Math.round(st.free / st.total * 100) : 0;
    return '<button class="board-col-head' + (clone ? ' hb-head' : '') + '" data-act="day" data-i="' + i +
      '" title="点这里单独查看 ' + esc(d.date) + '"' + (clone ? ' tabindex="-1"' : '') + '>' +
      '<span class="bch-top"><span class="bch-date"><b>' + esc(d.label) +
      '</b><small>' + esc(d.weekday) + '</small></span>' +
      '<span class="bch-stat">空闲 <b>' + st.free + '</b> / ' + st.total + '</span></span>' +
      '<span class="prog"><i style="width:' + pct + '%"></i></span></button>';
  }

  /** 点 ‹ › 或按 ← →：横向滚过一列 */
  function boardStep(dir) {
    var b = APP.querySelector ? APP.querySelector('.board') : null;
    if (!b) return;
    var col = b.querySelector ? b.querySelector('.board-col') : null;
    // 列距由 --col-gap 控制（窄屏 11px、宽屏 14px），按实际值翻页才不会越滑越偏
    var grid = b.querySelector ? b.querySelector('.board-grid') : null;
    var gap = 14;
    if (grid && window.getComputedStyle) {
      gap = parseFloat(window.getComputedStyle(grid).columnGap) || 14;
    }
    var w = (col && col.getBoundingClientRect ? col.getBoundingClientRect().width : 260) + gap;
    if (typeof b.scrollBy === 'function') {
      try { b.scrollBy({ left: dir * w, behavior: 'smooth' }); }
      catch (err) { b.scrollLeft += dir * w; }
    } else if ('scrollLeft' in b) {
      b.scrollLeft += dir * w;
    }
  }

  /** 手动滑动：鼠标按住拖动（左右滑看更多天，上下拖滚动整页）/ Shift+滚轮；触摸交给浏览器原生惯性滚动 */
  function initBoard() {
    var b = APP.querySelector ? APP.querySelector('.board') : null;
    if (!b || !b.addEventListener) return;

    function pageTop() {
      return (typeof window.pageYOffset === 'number' ? window.pageYOffset : 0) ||
        (document.documentElement && document.documentElement.scrollTop) || 0;
    }

    b.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'touch' || (e.pointerType === 'mouse' && e.button !== 0)) return;
      if (e.target.closest && e.target.closest('button,a,[data-act]')) return;
      BOARD.dragging = true; BOARD.moved = false;
      BOARD.x0 = e.clientX; BOARD.y0 = e.clientY;
      BOARD.left0 = b.scrollLeft; BOARD.top0 = pageTop(); BOARD.pid = e.pointerId;
      try { b.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
    });
    b.addEventListener('pointermove', function (e) {
      if (!BOARD.dragging) return;
      var dx = e.clientX - BOARD.x0;
      var dy = e.clientY - BOARD.y0;
      if (!BOARD.moved && Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
      BOARD.moved = true;
      b.classList.add('dragging');
      b.scrollLeft = BOARD.left0 - dx;
      // 上下拖动 = 拖动画布本身：整页跟着走，看板再长也能一把拉到底
      if (dy && typeof window.scrollTo === 'function') {
        window.scrollTo(0, Math.max(0, BOARD.top0 - dy));
      }
      if (e.cancelable) e.preventDefault();
    }, { passive: false });
    function endDrag() {
      if (!BOARD.dragging) return;
      BOARD.dragging = false;
      b.classList.remove('dragging');
      try { b.releasePointerCapture(BOARD.pid); } catch (err) { /* noop */ }
      BOARD.pid = null;
    }
    b.addEventListener('pointerup', endDrag);
    b.addEventListener('pointercancel', endDrag);
    b.addEventListener('wheel', function (e) {
      if (!e.shiftKey || !e.deltaY) return;
      b.scrollLeft += e.deltaY;
      if (e.cancelable) e.preventDefault();
    }, { passive: false });

    /* 悬浮日期条：横向位置始终和看板一致（整行位移，本身不滚动，也就没有滚动条） */
    var wrap = APP.querySelector('.board-sticky');
    var hb = APP.querySelector('.headbar');
    if (wrap && hb) {
      b.addEventListener('scroll', syncHead, { passive: true });
      STICKY.wrap = wrap; STICKY.head = hb; STICKY.board = b;
      bindSticky();
      stickyTick();
    }

    // 卡片两行排版：tag 顺序不变，先尽量填满第二行，放不下的前缀留在第一行
    initSlotRows();
  }

  /* ---------- 平铺卡两行排版 ---------- */

  /* 规则：tag 的先后顺序永远不动（CN → IP → 角色），只决定从哪一个开始换到第二行。
     做法：先尽量把**末尾**的 tag 摆进第二行（第二行优先吃饱），剩下的前缀留在第一行、跟在状态后面；
     于是从上往下读仍是 CN → IP → 角色。
     DOM 顺序完全不变，只把末尾 k 个包进 .slot-line（flex:0 0 100% 自动落到第二行）。 */
  var SLOTROWS = { bound: false, t: null };

  /** 还原成「一行到底」的结构，并按原始顺序排好（每次重排都从干净状态开始） */
  function slotGroups(main) {
    var infos = main.querySelector ? main.querySelector('.infos') : null;
    if (!infos) return null;
    var line = infos.querySelector('.slot-line');
    if (line) {
      while (line.firstChild) infos.insertBefore(line.firstChild, line);
      infos.removeChild(line);
    }
    var chips = [].slice.call(infos.querySelectorAll('.info'));
    for (var i = 0; i < chips.length; i++) {
      if (chips[i].__oi == null) chips[i].__oi = i;
    }
    chips.sort(function (a, b) { return a.__oi - b.__oi; });
    for (var j = 0; j < chips.length; j++) infos.appendChild(chips[j]);
    return { infos: infos, chips: chips };
  }

  /** 第一步：还原结构 + 关掉收缩与换行（只写不读，攒到最后一起量） */
  function prepareSlotRow(main) {
    var g = slotGroups(main);
    if (!g || g.chips.length < 2) return null;
    var chips = g.chips;
    main.style.flexWrap = 'nowrap';
    for (var i = 0; i < chips.length; i++) chips[i].style.flex = '0 0 auto';
    return { main: main, infos: g.infos, chips: chips, state: main.querySelector('.state') };
  }

  /** 第二步：算分组并落 DOM（所有卡片先量完再统一改，避免一张一张触发重排） */
  function applySlotRow(job) {
    var main = job.main, chips = job.chips, infos = job.infos;
    var widths = job.widths, gap = job.gap;
    main.style.flexWrap = '';
    for (var r = 0; r < chips.length; r++) chips[r].style.flex = '';

    var avail = job.avail, stateW = job.stateW, hasState = !!job.state;
    var n = chips.length;
    function sumPrefix(cnt) { var s = 0; for (var x = 0; x < cnt; x++) s += widths[x]; return s; }
    function sumSuffix(cnt) { var s = 0; for (var x = n - cnt; x < n; x++) s += widths[x]; return s; }
    function lineW(total, cnt) { return total + gap * Math.max(0, cnt - 1); }

    var all = lineW(stateW + sumPrefix(n), n + (hasState ? 1 : 0));
    if (all <= avail + 0.5) return;   // 一行放得下：保持原样

    // 挑「换行点」：k = 末尾几个 tag 放第二行（顺序不变），
    // 两行都放得下为前提，取两行长度最接近的那个（避免一行挤爆、一行空荡）
    var k = 0, bestDiff = Infinity;
    for (var t = n; t >= 1; t--) {
      var row2 = lineW(sumSuffix(t), t);
      var rest = n - t;
      var row1 = lineW(stateW + sumPrefix(rest), rest + (hasState ? 1 : 0));
      if (row2 > avail + 0.5 || row1 > avail + 0.5) continue;
      var diff = Math.abs(row1 - row2);
      if (diff < bestDiff - 0.5) { bestDiff = diff; k = t; }
    }
    if (!k) return;   // 怎么摆都放不下：交给原来的自然换行

    // 顺序不动：只把末尾 k 个 tag 包进第二行，前面的照旧留在状态后面
    var line = document.createElement('div');
    line.className = 'slot-line';
    line.style.gap = job.rowGap + 'px ' + gap + 'px';
    for (var q = n - k; q < n; q++) line.appendChild(chips[q]);
    infos.appendChild(line);
    main.__packed = true;
  }

  function layoutSlotRows() {
    if (!APP.querySelectorAll) return;
    var mains = APP.querySelectorAll('.board .slot-main');
    var jobs = [], i, j;
    for (i = 0; i < mains.length; i++) {
      var job = prepareSlotRow(mains[i]);
      if (job) jobs.push(job);
    }
    // 统一量：中间不写样式，整页只重排一次
    for (j = 0; j < jobs.length; j++) {
      var jb = jobs[j], cs = getComputedStyle(jb.main);
      jb.widths = [];
      for (i = 0; i < jb.chips.length; i++) jb.widths.push(jb.chips[i].getBoundingClientRect().width);
      jb.stateW = jb.state ? jb.state.getBoundingClientRect().width : 0;
      jb.avail = jb.main.clientWidth;
      jb.gap = parseFloat(cs.columnGap) || 0;
      jb.rowGap = parseFloat(cs.rowGap) || 0;
    }
    for (j = 0; j < jobs.length; j++) applySlotRow(jobs[j]);
    // 兜底：两行还是超高（字体 / 缩放异常）就退回自然换行
    for (j = 0; j < jobs.length; j++) {
      var m = jobs[j].main;
      if (m.__packed && m.scrollHeight > m.clientHeight + 1) {
        m.__packed = false;
        slotGroups(m);
      }
    }
    alignBoardRows();
  }

  /**
   * 手机上卡片高度跟内容走：某天带图、某天只有文字，两列就会一行一行错开，
   * 左右的「13:00」不在同一水平线上。量出全表最高的卡片与列头，写成
   * --row-h / --head-h 给所有列共用，行线就重新对齐了。
   * 只有窄屏需要：宽屏每张卡本来就是固定 84px。
   */
  function alignBoardRows() {
    var grid = APP.querySelector ? APP.querySelector('.board-grid') : null;
    if (!grid) return;
    if (!window.matchMedia || !window.matchMedia('(max-width:420px)').matches) {
      grid.style.removeProperty('--row-h');
      grid.style.removeProperty('--head-h');
      return;
    }
    // 先撤掉上一轮统一的行高，量到的才是各卡自己的自然高度
    grid.style.setProperty('--row-h', '0px');
    grid.style.setProperty('--head-h', '0px');
    var slots = grid.querySelectorAll('.board-col-body > .slot');
    var heads = grid.querySelectorAll('.board-col-head');
    var maxRow = 0, maxHead = 0, i, h;
    for (i = 0; i < slots.length; i++) {
      h = slots[i].getBoundingClientRect().height;
      if (h > maxRow) maxRow = h;
    }
    for (i = 0; i < heads.length; i++) {
      h = heads[i].getBoundingClientRect().height;
      if (h > maxHead) maxHead = h;
    }
    if (maxRow > 0) grid.style.setProperty('--row-h', Math.ceil(maxRow) + 'px');
    if (maxHead > 0) grid.style.setProperty('--head-h', Math.ceil(maxHead) + 'px');
  }

  /** 立刻量一遍（避免首帧闪动）；字体就绪与窗口变化时再重排（只绑定一次） */
  function initSlotRows() {
    layoutSlotRows();
    if (SLOTROWS.bound) return;
    SLOTROWS.bound = true;
    window.addEventListener('resize', function () {
      if (SLOTROWS.t) clearTimeout(SLOTROWS.t);
      SLOTROWS.t = setTimeout(layoutSlotRows, 120);
    });
    if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
      document.fonts.ready.then(function () { layoutSlotRows(); });
    }
  }

  function renderBoard(ex) {
    var dates = ex.dates || [];
    // 导航按钮跟着看板一起收窄居中，左边缘与标题条、首列对齐
    var hero = navHTML(true, false, dates.length || 1);
    // 平铺页把大图换成紧凑标题条：首屏直接就是看板，不用先滚过一整屏头图
    // 标题条塞进 .board-sticky：往下滚时钉在窗口顶部，日期列头浮在它下面
    var bar = '<div class="board-sticky" id="boardSticky" style="--days:' + Math.max(1, dates.length) + '">' +
      '<section class="board-bar">' + barInner(ex, dates.length) + '</section>';

    if (!dates.length) {
      APP.innerHTML = shell(hero + bar + '</div>' +
        '<div class="empty" style="margin-top:18px"><span class="big">◌</span>该漫展暂未配置可预约日期</div>');
      return;
    }

    var cols = dates.map(function (d, i) {
      var body = (d.slots || []).length
        ? d.slots.map(function (s) { return slotHTML(s); }).join('')
        : '<div class="board-empty">该日暂无时间段</div>';
      return '<article class="board-col">' + colHeadHTML(d, i) +
        '<div class="board-col-body">' + body + '</div></article>';
    }).join('');

    // 悬浮日期条：与看板列宽、间距完全一致，横向位移跟随看板 scrollLeft
    bar += '<div class="headbar" id="boardHeadBar" aria-label="各日期"><div class="headbar-row">' +
      dates.map(function (d, i) {
        return '<div class="hb-col">' + colHeadHTML(d, i, true) + '</div>';
      }).join('') + '</div></div></div>';

    APP.innerHTML = shell(hero + bar +
      '<section class="board"><div class="board-grid">' + cols + '</div></section>', true);
    initBoard();
    window.scrollTo(0, 0);
  }

  /* ---------- 路由 ---------- */

  function parseHash() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    var parts = h.split('/').filter(Boolean);
    if (parts[0] !== 'ex' || !parts[1]) return { view: 'home' };
    var id = decodeURIComponent(parts[1]);
    var ex = EXS.filter(function (e) { return e.id === id; })[0];
    if (!ex) return { view: 'home' };
    if (parts[2] === 'all') return { view: 'board', ex: ex, i: 0 };
    var di = 0;
    if (parts[2]) {
      var found = (ex.dates || []).map(function (d) { return d.date; })
        .indexOf(decodeURIComponent(parts[2]));
      if (found >= 0) di = found;
    }
    return { view: 'detail', ex: ex, i: di };
  }

  function render() {
    var r = parseHash();
    if (r.view === 'detail') renderDetail(r.ex, r.i);
    else if (r.view === 'board') renderBoard(r.ex);
    else renderHome();
    document.title = (r.view === 'home' ? '' : r.ex.name + ' · ') +
      (brand().title || DATA.title || '玖音接单排单表');
  }

  function go(hash) {
    if (location.hash === hash) render();
    else location.hash = hash;
  }

  /* ---------- 事件（委托） ---------- */

  APP.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'home') { go('#/'); return; }
    // 首页点卡片：按工程设置决定落在「单日查看」还是「全部平铺」
    if (act === 'open') {
      var openId = el.getAttribute('data-id');
      go('#/ex/' + encodeURIComponent(openId) + (DATA.defaultView === 'board' ? '/all' : ''));
      return;
    }
    var r = parseHash();
    if (r.view === 'home') return;
    var dates = r.ex.dates || [];

    if (act === 'cover') {
      var wrap = el.closest ? el.closest('.bh-cover-wrap') : el;
      var im = wrap && wrap.querySelector ? wrap.querySelector('.bh-cover') : null;
      openCover(im && (im.currentSrc || im.src), r.ex.name);
      return;
    }
    if (act === 'board') { go('#/ex/' + encodeURIComponent(r.ex.id) + '/all'); return; }
    if (act === 'single') {
      var back = lastDetailDate || (dates[0] && dates[0].date);
      go('#/ex/' + encodeURIComponent(r.ex.id) + (back ? '/' + encodeURIComponent(back) : ''));
      return;
    }

    var i = +el.getAttribute('data-i');
    var target = act === 'prev' ? i - 1 : act === 'next' ? i + 1 : i;
    target = Math.max(0, Math.min(dates.length - 1, target));
    if (dates[target]) {
      go('#/ex/' + encodeURIComponent(r.ex.id) + '/' + encodeURIComponent(dates[target].date));
      var on = APP.querySelector('.day-dot.on');
      if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
    }
  });

  APP.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var el = e.target.closest('[data-act]');
    if (el && (el.tagName === 'ARTICLE' || el.tagName === 'A')) {
      e.preventDefault(); el.click();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      // 灯箱优先：开着的时候 Esc 只关灯箱，不跳页
      if (document.body.classList.contains('lb-open')) { closeCover(); return; }
      var rb = parseHash();
      if (rb.view === 'board') {
        var datesB = rb.ex.dates || [];
        var backD = lastDetailDate || (datesB[0] && datesB[0].date);
        go('#/ex/' + encodeURIComponent(rb.ex.id) + (backD ? '/' + encodeURIComponent(backD) : ''));
      }
      return;
    }
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    var r = parseHash();
    var step = e.key === 'ArrowRight' ? 1 : -1;
    if (r.view === 'board') { e.preventDefault(); boardStep(step); return; }
    if (r.view !== 'detail') return;
    var dates = r.ex.dates || [];
    var t = r.i + step;
    if (t < 0 || t >= dates.length) return;
    e.preventDefault();
    go('#/ex/' + encodeURIComponent(r.ex.id) + '/' + encodeURIComponent(dates[t].date));
  });

  window.addEventListener('hashchange', render);
  render();
})();

</script>
</body>
</html>
